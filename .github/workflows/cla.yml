name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the Individual CLA Document and I hereby sign the Individual CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: "https://github.com/agentic-protocols/agentic-attestation-protocol/blob/main/ICLA.md"
          path-to-signatures: "signatures/version1/cla.json"
          custom-pr-sign-comment: "I have read the Individual CLA Document and I hereby sign the Individual CLA"
          custom-notsigned-prcomment: "Thank you for your contribution. Before we can accept it, you must sign the [AAP Individual Contributor License Agreement](https://github.com/agentic-protocols/agentic-attestation-protocol/blob/main/ICLA.md) by posting the comment below. This signature is made in your individual capacity; a [Corporate CLA](https://github.com/agentic-protocols/agentic-attestation-protocol/blob/main/CCLA.md) executed by your employer does not replace it."
          # This branch must exist (the action creates the file, not the
          # branch) and stay unprotected.
          branch: "cla-signatures"
          allowlist: "dependabot[bot],*[bot]"
